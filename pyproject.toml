[project]
name = "dendrite"
version = "0.10.0"
description = "Open-source platform for BCI research and development"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"

dependencies = [
    "h5py>=3.12",
    "mne>=1.10.0",
    "numpy>=2.0.0",
    "pylsl>=1.16",
    "scikit-learn>=1.6.0",
    "scipy>=1.16.0",
    "torch>=2.6.0,<2.7.0",
    "pydantic>=2.11",
    "psutil>=6.1.0",
    "optuna>=4.1.0",
    "moabb>=1.2.0",
    "braindecode>=1.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "msgpack>=1.0.0",
    "philistine>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/dendrite-bci/dendrite"
Documentation = "https://dendrite-bci.github.io/dendrite"
Repository = "https://github.com/dendrite-bci/dendrite"

[project.optional-dependencies]
zmq = ["pyzmq>=25.0.0"]

[project.scripts]
dendrite = "dendrite.web.entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dendrite"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.1.0",
    "pyright>=1.1.408",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slow: Slow running tests",
    "integration: Integration tests (require LSL/hardware)",
    "benchmark: Eval benchmarks (require local data files, slow)",
    "e2e: Full live-system e2e harness tests (spawn the backend; require local data or MOABB)",
    "e2e_regression: e2e harness regression — all sessions, diffed against a committed baseline",
]
addopts = "-m 'not benchmark and not integration and not e2e and not e2e_regression'"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = ["E501", "E402", "E741", "RUF001", "RUF005", "RUF012", "RUF015", "RUF022", "RUF059"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Form",
    "fastapi.File",
]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["src"]
exclude = [
    "tests",
    ".venv",
    "docs",
    "src/dendrite/data/streaming/ros2.py",
    "src/dendrite/data/streaming/zmq.py",
]
reportMissingImports = "warning"
reportUndefinedVariable = true
